<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Simulator | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <h1>Bank Simulator</h1>
        <p class="intro">Log in to your account.</p>

        <form id="login-form" class="form-panel" novalidate>
            <label for="account-number">Account number</label>
            <input id="account-number" name="account_number" type="text" inputmode="numeric" pattern="[0-9]{4,20}" autocomplete="username" required>

            <label for="pin">PIN</label>
            <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="current-password" required>

            <p id="login-message" class="notice" role="status" aria-live="polite" hidden></p>
            <button class="button" type="submit">Log in</button>
        </form>

        <p class="page-foot">No account? <a href="create-account.html">Create one</a></p>
    </main>
</body>
</html>
